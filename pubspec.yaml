name: taxawu
description: Taxawu est une application de surveillance environnementale qui exploite les données satellitaires à travers l'intelligence artificielle pour suivre l'évolution de la couverture forestière, détecter les risques de feux de brousse et d'inondations, et fournir des alertes précoces.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.9.1
  image_picker: ^1.0.7
  camera: ^0.11.0
  google_fonts: ^6.2.1
  community_material_icon: ^5.4.55

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo_blanc.png
